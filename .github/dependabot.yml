version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # PuLP 4 changed the LpVariable constructor; see requirements.txt.
      - dependency-name: pulp
        update-types: ["version-update:semver-major"]
